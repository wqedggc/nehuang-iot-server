<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>涅凰智农 · 管理后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23103d2b'/%3E%3Cpath d='M18 46V18h7l14 18V18h7v28h-7L25 28v18z' fill='%23a7c66d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script src="../version.js"></script>
</head>
<body>

<!-- ===== 侧边栏 ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-mark" aria-hidden="true">N</div>
    <div>
      <span class="sidebar-brand-kicker">NEHUANG FIELD</span>
      <div class="sidebar-brand-name">涅凰智农</div>
      <span class="sidebar-subtitle">田间控制台</span>
    </div>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav">
    <button type="button" class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Dashboard</span>
    </button>
    <button type="button" class="nav-item" data-page="users" onclick="navigate('users')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>用户管理</span>
    </button>
    <button type="button" class="nav-item" data-page="gateways" onclick="navigate('gateways')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
      <span>设备管理</span>
    </button>
    <button type="button" class="nav-item" data-page="bindings" onclick="navigate('bindings')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span>绑定管理</span>
    </button>
    <button type="button" class="nav-item" data-page="operation-logs" onclick="navigate('operation-logs')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>操作日志</span>
    </button>
    <button type="button" class="nav-item" data-page="logs" onclick="navigate('logs')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>控制日志</span>
    </button>
    <button type="button" class="nav-item" data-page="help-center" onclick="navigate('help-center')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/><path d="M9.05 9.4C9.47 8.36 10.44 7.5 11.7 7.5c1.56 0 2.82 1.16 2.82 2.6 0 1.15-.73 1.85-1.44 2.37-.58.42-.98.66-1.02 1.35h-1.1M12 16h.01"/></svg>
      <span>帮助中心</span>
    </button>
    <button type="button" class="nav-item" data-page="payload-events" onclick="navigate('payload-events')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>原始报文排查</span>
    </button>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user" id="sidebar-user">
      <span class="sidebar-user-avatar" id="sidebar-user-avatar"></span>
      <div>
        <div class="sidebar-user-name" id="sidebar-user-name">管理员</div>
        <div class="sidebar-user-role" id="sidebar-user-role"></div>
      </div>
    </div>
    <button class="btn-icon" onclick="doLogout()" title="退出登录" aria-label="退出登录">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
  <div class="sidebar-version">VERSION&nbsp; <span id="app-version">?</span></div>
</aside>

<!-- ===== 主区域 ===== -->
<div class="main-area">
  <header class="topbar-admin">
    <div class="topbar-admin-heading">
      <span class="topbar-admin-kicker">FIELD OPERATIONS</span>
      <h1 class="topbar-page-title" id="topbar-page-title">Dashboard</h1>
    </div>
    <div class="topbar-actions">
      <span class="topbar-time" id="topbar-time"></span>
    </div>
  </header>

  <main class="content-area" id="main-content">
    <!-- 页面内容由 JS 动态渲染 -->
  </main>
</div>

<!-- ===== Modal ===== -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal" id="modal-content"></div>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast" aria-live="polite"></div>

<script src="../shared/api-client.js"></script>
<script src="raw-debug.js"></script>
<script src="help-center-content.js"></script>
<script src="app.js"></script>
</body>
</html>
